name: Validate marketplace

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Copilot CLI
        run: npm install --global @github/copilot

      - name: Validate owned plugin
        run: bash scripts/validate-marketplace.sh
