name: Update external pins

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: external-pin-updates
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.updates.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      - id: updates
        name: Find changed external plugins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "matrix=$(node scripts/catalog.mjs check-updates --json)" >> "$GITHUB_OUTPUT"

  update:
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '{"include":[]}' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci

      - name: Update one reviewed pin candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/catalog.mjs update "${{ matrix.name }}"

      - name: Install Copilot CLI
        run: npm install --global @github/copilot

      - name: Validate update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/validate-marketplace.sh

      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/update-${{ matrix.name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add \
            .agents/plugins/marketplace.json \
            .github/plugin/marketplace.json \
            .claude-plugin/marketplace.json
          git commit -m "chore: update ${{ matrix.name }} pin"
          git push --force-with-lease origin "HEAD:$branch"

          if [[ -z "$(gh pr list --head "$branch" --json number --jq '.[0].number')" ]]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: update ${{ matrix.name }} pin" \
              --body "Updates only the reviewed pin for ${{ matrix.name }}, regenerates both client catalogs, and runs full marketplace validation. This pull request requires human review and is never auto-merged."
          fi
